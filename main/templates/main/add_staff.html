<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ExpiryGuard | Add Staff</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #f4f8ff,
                    #eaf2ff
                );

            color: #172033;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            height: 70px;

            background: #081b33;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 35px;

            box-shadow:
                0 4px 15px
                rgba(8, 27, 51, 0.15);
        }


        .logo {

            font-size: 25px;

            font-weight: 700;

            color: white;
        }


        .home-btn {

            text-decoration: none;

            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #3b82f6
                );

            color: white;

            padding: 10px 20px;

            border-radius: 9px;

            font-weight: 600;

            font-size: 14px;

            box-shadow:
                0 5px 15px
                rgba(37, 99, 235, 0.20);

            transition: 0.25s;
        }


        .home-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(37, 99, 235, 0.30);
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            max-width: 550px;

            margin: 50px auto;

            padding: 20px;
        }


        /* =========================
           CARD
        ========================= */

        .card {

            background: white;

            padding: 35px;

            border-radius: 18px;

            border:
                1px solid #dbe7f5;

            box-shadow:
                0 15px 35px
                rgba(30, 64, 175, 0.10);

            position: relative;

            overflow: hidden;
        }


        .card::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    #1d4ed8,
                    #3b82f6,
                    #60a5fa
                );
        }


        /* =========================
           TITLE
        ========================= */

        h1 {

            margin-top: 5px;

            margin-bottom: 28px;

            color: #123b68;

            font-size: 28px;

            font-weight: 700;
        }


        /* =========================
           LABEL
        ========================= */

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: 600;

            color: #334155;

            font-size: 14px;
        }


        /* =========================
           INPUT
        ========================= */

        input {

            width: 100%;

            padding: 13px 14px;

            margin-bottom: 19px;

            border:
                1px solid #d7e2ef;

            border-radius: 9px;

            font-size: 14px;

            color: #334155;

            background: white;

            transition: 0.25s;
        }


        input::placeholder {

            color: #94a3b8;
        }


        input:focus {

            outline: none;

            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px
                rgba(59,130,246,0.12);
        }


        /* =========================
           SAVE BUTTON
        ========================= */

        .save-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #3b82f6
                );

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 7px 18px
                rgba(37,99,235,0.20);

            transition: 0.25s;
        }


        .save-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 23px
                rgba(37,99,235,0.30);
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #1d4ed8;

            text-decoration: none;

            font-weight: 600;

            font-size: 14px;

            transition: 0.2s;
        }


        .back:hover {

            color: #123b68;
        }


        /* =========================
           MESSAGES
        ========================= */

        .messages {

            margin-bottom: 20px;
        }


        .message {

            background: #eff6ff;

            color: #1d4ed8;

            border:
                1px solid #bfdbfe;

            padding: 12px 14px;

            border-radius: 9px;

            margin-bottom: 10px;

            font-size: 14px;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            text-align: center;

            margin-top: 25px;

            color: #94a3b8;

            font-size: 12px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .header {

                padding: 0 20px;
            }


            .logo {

                font-size: 21px;
            }


            .home-btn {

                padding: 9px 15px;

                font-size: 13px;
            }


            .container {

                margin: 30px auto;

                padding: 15px;
            }


            .card {

                padding: 28px 22px;

                border-radius: 16px;
            }


            h1 {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">


        <div class="logo">

            ExpiryGuard

        </div>


        <a
            href="{% url 'home' %}"
            class="home-btn">

            🏠 Home

        </a>


    </div>



    <!-- =========================
         MAIN
    ========================= -->

    <div class="container">


        <div class="card">


            <h1>

                ➕ Add Staff

            </h1>



            <!-- =========================
                 MESSAGES
            ========================= -->

            {% if messages %}

                <div class="messages">

                    {% for message in messages %}

                        <div class="message">

                            {{ message }}

                        </div>

                    {% endfor %}

                </div>

            {% endif %}



            <!-- =========================
                 FORM
            ========================= -->

            <form method="POST">

                {% csrf_token %}


                <!-- USERNAME -->

                <label>

                    Username

                </label>


                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required>



                <!-- EMAIL -->

                <label>

                    Email

                </label>


                <input
                    type="email"
                    name="email"
                    placeholder="Enter email">



                <!-- PASSWORD -->

                <label>

                    Password

                </label>


                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required>



                <!-- CONFIRM PASSWORD -->

                <label>

                    Confirm Password

                </label>


                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    required>



                <!-- ADD STAFF -->

                <button
                    type="submit"
                    class="save-btn">

                    👥 Add Staff

                </button>


            </form>



            <!-- BACK -->

            <a
                href="{% url 'staff_management' %}"
                class="back">

                ← Back to Staff Management

            </a>


        </div>



        <!-- FOOTER -->

        <div class="footer">

            © 2026 ExpiryGuard · Smart Product Expiry Management

        </div>


    </div>


</body>

</html>
