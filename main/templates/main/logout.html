<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Logged Out - ExpiryGuard</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #f4f8ff,
                    #eaf2ff
                );
        }


        /* =================================
           LOGOUT CONTAINER
        ================================= */

        .logout-container {

            width: 100%;

            max-width: 440px;

            background: white;

            padding: 45px 35px;

            border-radius: 22px;

            text-align: center;

            border:
                1px solid #dbe7f5;

            box-shadow:
                0 20px 50px
                rgba(30,64,175,0.12);

            position: relative;

            overflow: hidden;
        }


        /* TOP BLUE LINE */

        .logout-container::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    #1d4ed8,
                    #3b82f6,
                    #60a5fa
                );
        }


        /* =================================
           LOGO
        ================================= */

        .logo {

            font-size: 30px;

            font-weight: 700;

            color: #123b68;

            margin-bottom: 25px;
        }


        /* =================================
           LOGOUT ICON
        ================================= */

        .icon {

            width: 80px;

            height: 80px;

            margin:
                0 auto 22px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #dbeafe,
                    #eff6ff
                );

            border:
                1px solid #bfdbfe;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 38px;

            font-weight: bold;

            color: #1d4ed8;

            box-shadow:
                0 8px 20px
                rgba(37,99,235,0.10);
        }


        /* =================================
           HEADING
        ================================= */

        h1 {

            color: #123b68;

            margin-bottom: 12px;

            font-size: 27px;

            font-weight: 700;
        }


        /* =================================
           DESCRIPTION
        ================================= */

        p {

            color: #64748b;

            font-size: 15px;

            margin-bottom: 30px;

            line-height: 1.7;
        }


        /* =================================
           LOGIN BUTTON
        ================================= */

        .login-btn {

            display: inline-block;

            width: 100%;

            padding: 14px;

            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #3b82f6
                );

            color: white;

            text-decoration: none;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 600;

            transition: 0.25s;

            box-shadow:
                0 8px 20px
                rgba(37,99,235,0.20);
        }


        .login-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(37,99,235,0.30);
        }


        /* =================================
           FOOTER
        ================================= */

        .footer {

            margin-top: 25px;

            color: #94a3b8;

            font-size: 13px;
        }


        /* =================================
           RESPONSIVE
        ================================= */

        @media (max-width: 450px) {

            body {

                padding: 10px;
            }


            .logout-container {

                padding:
                    40px 22px;
            }


            .logo {

                font-size: 26px;
            }


            h1 {

                font-size: 23px;
            }


            .icon {

                width: 70px;

                height: 70px;

                font-size: 32px;
            }

        }

    </style>

</head>


<body>


    <div class="logout-container">


        <!-- LOGO -->

        <div class="logo">

            ExpiryGuard

        </div>


        <!-- SUCCESS ICON -->

        <div class="icon">

            ✓

        </div>


        <!-- HEADING -->

        <h1>

            You have been logged out

        </h1>


        <!-- MESSAGE -->

        <p>

            You have successfully logged out
            of your ExpiryGuard account.
            Thank you for using ExpiryGuard.

        </p>


        <!-- LOGIN AGAIN -->

        <a
            href="{% url 'login' %}"
            class="login-btn"
        >

            Login Again

        </a>


        <!-- FOOTER -->

        <div class="footer">

            © 2026 ExpiryGuard

        </div>


    </div>


</body>

</html>
