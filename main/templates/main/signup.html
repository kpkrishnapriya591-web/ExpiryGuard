<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - ExpiryGuard</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: "Segoe UI", Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #f4f8ff,
                    #eaf2ff
                );

            padding: 20px;
        }


        /* =========================
           SIGNUP CONTAINER
        ========================= */

        .signup-container {

            width: 100%;

            max-width: 450px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            border: 1px solid #dbe7f5;

            box-shadow:
                0 20px 50px
                rgba(30,64,175,0.12);

            position: relative;

            overflow: hidden;
        }


        /* TOP BLUE LINE */

        .signup-container::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    #1d4ed8,
                    #3b82f6,
                    #60a5fa
                );
        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            text-align: center;

            color: #123b68;

            font-size: 30px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        /* =========================
           TITLE
        ========================= */

        .title {

            text-align: center;

            color: #64748b;

            font-size: 14px;

            margin-bottom: 28px;
        }


        /* =========================
           MESSAGES
        ========================= */

        .message {

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;

            font-weight: 600;
        }


        .message.error {

            background: #fee2e2;

            color: #b91c1c;

            border:
                1px solid #fecaca;
        }


        .message.success {

            background: #dbeafe;

            color: #1d4ed8;

            border:
                1px solid #bfdbfe;
        }


        /* =========================
           FORM GROUP
        ========================= */

        .form-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-size: 14px;

            font-weight: 700;
        }


        /* =========================
           INPUT
        ========================= */

        input {

            width: 100%;

            padding: 13px 14px;

            border:
                1px solid #cbd5e1;

            border-radius: 9px;

            outline: none;

            font-size: 14px;

            color: #334155;

            background: white;

            transition: 0.3s;
        }


        input::placeholder {

            color: #94a3b8;
        }


        input:hover {

            border-color: #bfdbfe;
        }


        input:focus {

            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px
                rgba(59,130,246,0.12);
        }


        /* =========================
           SIGNUP BUTTON
        ========================= */

        .signup-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #3b82f6
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;

            box-shadow:
                0 7px 18px
                rgba(37,99,235,0.20);

            transition: 0.3s;
        }


        .signup-btn:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 10px 24px
                rgba(37,99,235,0.30);
        }


        /* =========================
           LOGIN LINK
        ========================= */

        .login-link {

            text-align: center;

            margin-top: 20px;

            color: #64748b;

            font-size: 14px;
        }


        .login-link a {

            color: #1d4ed8;

            text-decoration: none;

            font-weight: 700;
        }


        .login-link a:hover {

            color: #1e40af;

            text-decoration: underline;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 500px) {

            body {

                padding: 10px;
            }


            .signup-container {

                padding: 32px 20px;

                border-radius: 16px;
            }


            .logo {

                font-size: 27px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         SIGNUP CONTAINER
    ========================= -->

    <div class="signup-container">


        <!-- LOGO -->

        <div class="logo">

            ExpiryGuard

        </div>


        <!-- TITLE -->

        <div class="title">

            Create your ExpiryGuard account

        </div>


        <!-- =========================
             DJANGO MESSAGES
        ========================= -->

        {% if messages %}

            {% for message in messages %}

                <div class="message {{ message.tags }}">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}



        <!-- =========================
             SIGNUP FORM
        ========================= -->

        <form
            method="POST"
            action="{% url 'signup' %}"
        >

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">

                    Username

                </label>


                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">

                    Email

                </label>


                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email"
                    autocomplete="email"
                    required
                >

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">

                    Password

                </label>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="new-password"
                    required
                >

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm_password">

                    Confirm Password

                </label>


                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    autocomplete="new-password"
                    required
                >

            </div>



            <!-- CREATE ACCOUNT -->

            <button
                type="submit"
                class="signup-btn"
            >

                Create Account

            </button>


        </form>



        <!-- =========================
             LOGIN LINK
        ========================= -->

        <div class="login-link">

            Already have an account?

            <a href="{% url 'login' %}">

                Login

            </a>

        </div>


    </div>


</body>

</html>
