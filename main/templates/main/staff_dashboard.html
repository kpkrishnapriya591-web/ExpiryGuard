<!DOCTYPE html>
<html>
<head>

    <title>Staff Dashboard - ExpiryGuard</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff1f3;
        }

        .header {
            background: #c95e6b;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
        }

        .logout {
            background: white;
            color: #c95e6b;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
        }

        .container {
            padding: 40px;
        }

        .welcome {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 220px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

    </style>

</head>

<body>

    <div class="header">

        <h1>ExpiryGuard - Staff Portal</h1>

        <a href="{% url 'logout' %}" class="logout">
            Logout
        </a>

    </div>


    <div class="container">

        <div class="welcome">

            <h2>Welcome to Staff Dashboard 👩🏻‍💼</h2>

            <p>
                You are successfully logged in as a staff member.
            </p>

        </div>


        <div class="cards">

            <div class="card">
                <h3>📦 Products</h3>
                <p>Manage products</p>
            </div>

            <div class="card">
                <h3>⏰ Expiry Alerts</h3>
                <p>Check expiring products</p>
            </div>

            <div class="card">
                <h3>🔔 Notifications</h3>
                <p>View notifications</p>
            </div>

        </div>

    </div>

</body>
</html>
