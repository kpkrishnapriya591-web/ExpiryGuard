<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ExpiryGuard | Update Product</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(
                    135deg,
                    #f4f8ff,
                    #eaf2ff
                );
            color: #334155;
        }

        /* HEADER */

        .header {
            background: #081b33;
            color: white;
            padding: 20px 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow:
                0 5px 18px rgba(8, 27, 51, 0.15);
        }

        .logo {
            font-size: 25px;
            font-weight: 700;
        }

        .back-btn {
            text-decoration: none;
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #3b82f6
                );

            padding: 10px 18px;
            border-radius: 8px;

            font-size: 14px;
            font-weight: 600;

            transition: 0.2s;
        }

        .back-btn:hover {
            transform: translateY(-1px);
        }

        /* CONTAINER */

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .title-section {
            margin-bottom: 25px;
        }

        .title-section h1 {
            color: #123b68;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .title-section p {
            color: #64748b;
            font-size: 14px;
        }

        /* FORM CARD */

        .form-card {
            background: white;
            padding: 35px;

            border-radius: 18px;

            border:
                1px solid #dbe7f5;

            box-shadow:
                0 15px 35px
                rgba(30, 64, 175, 0.10);

            position: relative;
        }

        .form-card::before {
            content: "";

            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    #1d4ed8,
                    #3b82f6,
                    #60a5fa
                );

            border-radius:
                18px 18px 0 0;
        }

        /* FORM */

        .form-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #123b68;

            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;

            padding: 12px 13px;

            border:
                1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 14px;

            color: #334155;

            background: #ffffff;

            outline: none;

            transition: 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.10);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            justify-content: flex-end;

            gap: 12px;

            margin-top: 30px;
        }

        .cancel-btn {
            text-decoration: none;

            padding: 12px 22px;

            border-radius: 8px;

            background: #e2e8f0;

            color: #334155;

            font-size: 14px;

            font-weight: 600;
        }

        .update-btn {
            border: none;

            padding: 12px 25px;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #3b82f6
                );

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 7px 18px
                rgba(37, 99, 235, 0.20);

            transition: 0.2s;
        }

        .update-btn:hover {
            transform: translateY(-1px);

            box-shadow:
                0 10px 24px
                rgba(37, 99, 235, 0.28);
        }

        /* MESSAGE */

        .messages {
            margin-bottom: 20px;
        }

        .message {
            padding: 13px 16px;

            background: #dbeafe;

            color: #1d4ed8;

            border:
                1px solid #bfdbfe;

            border-radius: 9px;

            margin-bottom: 10px;

            font-size: 14px;

            font-weight: 600;
        }

        /* RESPONSIVE */

        @media (max-width: 700px) {

            .header {
                padding: 18px 20px;
            }

            .logo {
                font-size: 22px;
            }

            .container {
                margin: 25px auto;
                padding: 0 15px;
            }

            .form-card {
                padding: 25px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .buttons {
                flex-direction: column;
            }

            .cancel-btn,
            .update-btn {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <div class="logo">
        ExpiryGuard
    </div>

    <a
        href="{% url 'manage_products' %}"
        class="back-btn"
    >
        ← Back to Products
    </a>

</div>



<!-- MAIN -->

<div class="container">


    <div class="title-section">

        <h1>
            Update Product
        </h1>

        <p>
            Update the product information and save the changes.
        </p>

    </div>



    <!-- MESSAGES -->

    {% if messages %}

        <div class="messages">

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        </div>

    {% endif %}



    <!-- FORM -->

    <div class="form-card">

        <form
            method="POST"
        >

            {% csrf_token %}


            <div class="form-grid">


                <!-- PRODUCT NAME -->

                <div class="form-group">

                    <label>
                        Product Name
                    </label>

                    <input
                        type="text"
                        name="product_name"
                        value="{{ product.product_name }}"
                        required
                    >

                </div>



                <!-- BARCODE -->

                <div class="form-group">

                    <label>
                        Barcode
                    </label>

                    <input
                        type="text"
                        name="barcode"
                        value="{{ product.barcode|default:'' }}"
                    >

                </div>



                <!-- CATEGORY -->

                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <input
                        type="text"
                        name="category"
                        value="{{ product.category }}"
                        required
                    >

                </div>



                <!-- BATCH NUMBER -->

                <div class="form-group">

                    <label>
                        Batch Number
                    </label>

                    <input
                        type="text"
                        name="batch_number"
                        value="{{ product.batch_number }}"
                    >

                </div>



                <!-- QUANTITY -->

                <div class="form-group">

                    <label>
                        Quantity
                    </label>

                    <input
                        type="number"
                        name="quantity"
                        value="{{ product.quantity }}"
                        min="0"
                        required
                    >

                </div>



                <!-- UNIT -->

               



                

                   



                <!-- PRICE -->

                <div class="form-group">

                    <label>
                        Price
                    </label>

                    <input
                        type="number"
                        name="price"
                        value="{{ product.price }}"
                        step="0.01"
                        min="0"
                    >

                </div>



                <!-- MANUFACTURE DATE -->

                <div class="form-group">

                    <label>
                        Manufacture Date
                    </label>

                    <input
                        type="date"
                        name="manufacture_date"
                        value="{{ product.manufacture_date|date:'Y-m-d' }}"
                    >

                </div>



                <!-- EXPIRY DATE -->

                <div class="form-group">

                    <label>
                        Expiry Date
                    </label>

                    <input
                        type="date"
                        name="expiry_date"
                        value="{{ product.expiry_date|date:'Y-m-d' }}"
                        required
                    >

                </div>



                <!-- LOCATION -->

               

               



                <!-- DESCRIPTION -->


            </div>



            <!-- BUTTONS -->

            <div class="buttons">

                <a
                    href="{% url 'manage_products' %}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="update-btn"
                >
                    Update Product
                </button>

            </div>


        </form>

    </div>


</div>


</body>

</html>
