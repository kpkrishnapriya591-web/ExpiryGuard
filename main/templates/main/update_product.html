<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ExpiryGuard | Update Staff</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f4f8ff,
                    #eaf2ff
                );

            color: #1f2937;

            min-height: 100vh;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            height: 70px;

            background:
                linear-gradient(
                    135deg,
                    #081b33,
                    #123f70
                );

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 35px;

            box-shadow:
                0 5px 20px rgba(15, 55, 100, 0.20);
        }


        .logo {
            font-size: 24px;

            font-weight: bold;

            color: white;
        }


        /* =========================
           HOME BUTTON
        ========================= */

        .home-btn {
            text-decoration: none;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #3b82f6
                );

            color: white;

            padding: 10px 20px;

            border-radius: 8px;

            font-weight: bold;

            transition: 0.3s;

            box-shadow:
                0 5px 15px rgba(37, 99, 235, 0.25);
        }


        .home-btn:hover {
            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #2563eb
                );

            transform: translateY(-2px);
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 550px;

            margin: 50px auto;

            padding: 20px;
        }


        /* =========================
           CARD
        ========================= */

        .card {
            background: white;

            padding: 32px;

            border-radius: 18px;

            border: 1px solid #dbe7f5;

            box-shadow:
                0 20px 50px rgba(30, 64, 175, 0.12);

            position: relative;

            overflow: hidden;
        }


        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;

            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    #1d4ed8,
                    #3b82f6,
                    #60a5fa
                );
        }


        /* =========================
           TITLE
        ========================= */

        h1 {
            margin-top: 5px;

            margin-bottom: 25px;

            color: #123b68;

            font-size: 27px;
        }


        /* =========================
           LABELS
        ========================= */

        label {
            display: block;

            margin: 16px 0 7px;

            font-weight: bold;

            color: #123b68;

            font-size: 14px;
        }


        /* =========================
           INPUTS
        ========================= */

        input[type="text"],
        input[type="email"],
        input[type="password"] {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            background: #f8fbff;

            color: #1f2937;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }


        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {

            border-color: #3b82f6;

            background: white;

            box-shadow:
                0 0 0 3px #dbeafe;
        }


        input::placeholder {
            color: #94a3b8;
        }


        /* =========================
           CHECKBOX
        ========================= */

        .active-label {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-top: 20px;

            color: #123b68;

            font-weight: 600;

            cursor: pointer;
        }


        .check {

            width: 17px;

            height: 17px;

            margin: 0;

            accent-color: #2563eb;

            cursor: pointer;
        }


        /* =========================
           UPDATE BUTTON
        ========================= */

        .update-btn {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #3b82f6
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 7px 18px rgba(37, 99, 235, 0.22);
        }


        .update-btn:hover {

            background:
                linear-gradient(
                    135deg,
                    #1e40af,
                    #2563eb
                );

            transform: translateY(-2px);
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back {

            display: block;

            text-align: center;

            margin-top: 18px;

            padding: 10px;

            color: #2563eb;

            text-decoration: none;

            font-weight: bold;

            border-radius: 7px;

            transition: 0.2s;
        }


        .back:hover {

            background: #eff6ff;

            color: #1d4ed8;
        }


        /* =========================
           MESSAGES
        ========================= */

        .messages {
            margin-bottom: 18px;
        }


        .message {

            padding: 12px 14px;

            background: #fee2e2;

            color: #b91c1c;

            border: 1px solid #fecaca;

            border-radius: 8px;

            font-size: 14px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .header {

                height: auto;

                padding: 18px 20px;
            }


            .logo {
                font-size: 21px;
            }


            .container {

                width: 100%;

                margin: 25px auto;

                padding: 15px;
            }


            .card {

                padding: 27px 22px;

                border-radius: 16px;
            }


            h1 {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <div class="logo">
            ExpiryGuard
        </div>


        <a
            href="{% url 'home' %}"
            class="home-btn">

            🏠 Home

        </a>

    </div>


    <!-- =========================
         MAIN CONTAINER
    ========================= -->

    <div class="container">


        <div class="card">


            <!-- TITLE -->

            <h1>
                ✏️ Update Staff
            </h1>


            <!-- =========================
                 DJANGO MESSAGES
            ========================= -->

            {% if messages %}

                <div class="messages">

                    {% for message in messages %}

                        <div class="message">
                            {{ message }}
                        </div>

                    {% endfor %}

                </div>

            {% endif %}


            <!-- =========================
                 UPDATE FORM
            ========================= -->

            <form method="POST">

                {% csrf_token %}


                <!-- USERNAME -->

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    value="{{ staff.username }}"
                    required
                >


                <!-- EMAIL -->

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ staff.email }}"
                >


                <!-- PASSWORD -->

                <label>
                    New Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Leave empty to keep current password"
                >


                <!-- ACTIVE STATUS -->

                <label class="active-label">

                    <input
                        type="checkbox"
                        name="is_active"
                        class="check"
                        {% if staff.is_active %}checked{% endif %}
                    >

                    Active Staff

                </label>


                <!-- UPDATE -->

                <button
                    type="submit"
                    class="update-btn">

                    💾 Update Staff

                </button>

            </form>


            <!-- BACK -->

            <a
                href="{% url 'staff_management' %}"
                class="back">

                ← Back to Staff Management

            </a>


        </div>

    </div>


</body>

</html>
