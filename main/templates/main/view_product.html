<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Staff - ExpiryGuard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f4f8ff,
                    #eaf2ff
                );

            color: #1f2937;

            min-height: 100vh;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            background:
                linear-gradient(
                    135deg,
                    #081b33,
                    #123f70
                );

            color: white;

            padding: 20px 40px;

            box-shadow:
                0 5px 20px rgba(15, 55, 100, 0.20);
        }

        .header h1 {
            margin: 0;

            font-size: 25px;

            font-weight: 700;
        }

        .header p {
            margin: 5px 0 0;

            color: #bfdbfe;

            font-size: 14px;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 100%;

            max-width: 520px;

            margin: 50px auto;

            background: white;

            padding: 35px;

            border-radius: 20px;

            border: 1px solid #dbe7f5;

            box-shadow:
                0 20px 50px rgba(30, 64, 175, 0.12);

            position: relative;

            overflow: hidden;
        }


        .container::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;

            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    #1d4ed8,
                    #3b82f6,
                    #60a5fa
                );
        }


        /* =========================
           TITLE
        ========================= */

        h2 {
            text-align: center;

            margin: 5px 0 28px;

            color: #123b68;

            font-size: 27px;
        }


        /* =========================
           FORM
        ========================= */

        label {
            display: block;

            margin-top: 16px;

            margin-bottom: 7px;

            font-weight: bold;

            color: #123b68;

            font-size: 14px;
        }


        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            background: #f8fbff;

            color: #1f2937;

            transition: 0.2s;
        }


        input:focus {
            border-color: #3b82f6;

            background: white;

            box-shadow:
                0 0 0 3px #dbeafe;
        }


        input::placeholder {
            color: #94a3b8;
        }


        /* =========================
           UPDATE BUTTON
        ========================= */

        button {
            width: 100%;

            margin-top: 28px;

            padding: 13px;

            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #3b82f6
                );

            color: white;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;

            transition: 0.3s;

            box-shadow:
                0 7px 18px rgba(37, 99, 235, 0.22);
        }


        button:hover {
            background:
                linear-gradient(
                    135deg,
                    #1e40af,
                    #2563eb
                );

            transform: translateY(-2px);
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back {
            display: block;

            text-align: center;

            margin-top: 18px;

            text-decoration: none;

            color: #2563eb;

            font-weight: 600;

            font-size: 14px;

            padding: 10px;

            border-radius: 7px;

            transition: 0.2s;
        }


        .back:hover {
            background: #eff6ff;

            color: #1d4ed8;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .header {
                padding: 18px 20px;
            }

            .container {
                width: calc(100% - 30px);

                margin: 30px auto;

                padding: 28px 22px;
            }

            h2 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <h1>
            ExpiryGuard
        </h1>

        <p>
            Staff Management
        </p>

    </div>


    <!-- =========================
         UPDATE STAFF FORM
    ========================= -->

    <div class="container">

        <h2>
            👥 Update Staff
        </h2>


        <form method="POST">

            {% csrf_token %}


            <!-- USERNAME -->

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                value="{{ staff.username }}"
                required
            >


            <!-- EMAIL -->

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                value="{{ staff.email }}"
                required
            >


            <!-- PASSWORD -->

            <label>
                New Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Leave blank to keep current password"
            >


            <!-- SUBMIT -->

            <button type="submit">
                💾 Update Staff
            </button>

        </form>


        <!-- BACK -->

        <a
            href="{% url 'staff_management' %}"
            class="back"
        >
            ← Back to Manage Staff
        </a>

    </div>


</body>

</html>
