<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product - ExpiryGuard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fa;
            min-height: 100vh;
        }

        .header {
            background: #242936;
            color: white;
            padding: 20px 35px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h1 {
            color: #242936;
            font-size: 30px;
        }

        .title p {
            color: #777;
            margin-top: 7px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #d5d8dc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #242936;
        }

        .required {
            color: red;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        .save-btn {
            background: #242936;
            color: white;
            border: none;
            padding: 13px 30px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        .save-btn:hover {
            background: #161a22;
        }

        .cancel-btn {
            background: #e5e7eb;
            color: #333;
            text-decoration: none;
            padding: 13px 30px;
            border-radius: 7px;
        }

        .message {
            padding: 12px;
            margin-bottom: 20px;
            background: #fff3cd;
            border-radius: 7px;
            color: #664d03;
        }

        @media(max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: span 1;
            }

        }

    </style>

</head>

<body>

    <div class="header">
        ExpiryGuard — Staff
    </div>

    <div class="container">

        <div class="title">
            <h1>Add New Product</h1>
            <p>Enter the product details below.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="card">

            <form method="POST">

                {% csrf_token %}

                <div class="form-grid">

                    <div class="form-group">
                        <label>
                            Product Name <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            name="name"
                            placeholder="Enter product name"
                            required>
                    </div>


                    <div class="form-group">
                        <label>
                            Barcode <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            name="barcode"
                            placeholder="Enter barcode"
                            required>
                    </div>


                    <div class="form-group">
                        <label>
                            Batch Number <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            name="batch_number"
                            placeholder="Enter batch number"
                            required>
                    </div>


                    <div class="form-group">
                        <label>Category</label>

                        <input
                            type="text"
                            name="category"
                            placeholder="Example: Food, Medicine">
                    </div>


                    <div class="form-group">
                        <label>
                            Manufacture Date <span class="required">*</span>
                        </label>

                        <input
                            type="date"
                            name="manufacture_date"
                            required>
                    </div>


                    <div class="form-group">
                        <label>
                            Expiry Date <span class="required">*</span>
                        </label>

                        <input
                            type="date"
                            name="expiry_date"
                            required>
                    </div>


                    <div class="form-group">
                        <label>
                            MRP / Price <span class="required">*</span>
                        </label>

                        <input
                            type="number"
                            name="price"
                            step="0.01"
                            min="0"
                            placeholder="Enter MRP"
                            required>
                    </div>


                    <div class="form-group">
                        <label>Quantity</label>

                        <input
                            type="number"
                            name="quantity"
                            min="0"
                            value="0"
                            placeholder="Enter quantity">
                    </div>


                    <div class="form-group">
                        <label>Unit</label>

                        <select name="unit">

                            <option value="">Select unit</option>
                            <option value="Pieces">Pieces</option>
                            <option value="Packets">Packets</option>
                            <option value="Boxes">Boxes</option>
                            <option value="Bottles">Bottles</option>
                            <option value="Kg">Kg</option>
                            <option value="Grams">Grams</option>
                            <option value="Litres">Litres</option>
                            <option value="Ml">Ml</option>

                        </select>

                    </div>

                </div>


                <div class="buttons">

                    <button
                        type="submit"
                        class="save-btn">
                        Save Product
                    </button>

                    <a
                        href="{% url 'manage_products' %}"
                        class="cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
