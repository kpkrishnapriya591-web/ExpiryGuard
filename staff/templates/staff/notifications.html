<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product - ExpiryGuard</title>

    <!-- Barcode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            color: #18181b;
        }

        .header {
            background: #18181b;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            border: 1px solid #d4a017;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .back-btn:hover {
            background: #d4a017;
            color: #18181b;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .title p {
            color: #71717a;
        }

        .scanner-box {
            width: 100%;
            max-width: 550px;
            margin: auto;
            border: 2px solid #d4a017;
            border-radius: 15px;
            padding: 15px;
            background: #fafafa;
        }

        #reader {
            width: 100%;
        }

        .scan-status {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f4f4f5;
            font-size: 16px;
        }

        .barcode-result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background: #18181b;
            color: white;
            text-align: center;
            display: none;
        }

        .barcode-result h3 {
            color: #d4a017;
            margin-bottom: 10px;
        }

        .barcode-number {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .success {
            color: #15803d;
            font-weight: bold;
        }

        .error {
            color: #dc2626;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>ExpiryGuard</h1>

        <a href="{% url 'staff_home' %}" class="back-btn">
            ← Staff Home
        </a>
    </div>


    <div class="container">

        <div class="card">

            <div class="title">
                <h2>📦 Add Product</h2>
                <p>Scan the product barcode using your camera</p>
            </div>


            <div class="scanner-box">

                <div id="reader"></div>

            </div>


            <div class="scan-status" id="scanStatus">
                📷 Starting camera...
            </div>


            <div class="barcode-result" id="barcodeResult">

                <h3>Barcode Detected</h3>

                <div class="barcode-number" id="barcodeNumber">
                </div>

            </div>

        </div>

    </div>


<script>

    let scanner = null;

    function startScanner() {

        scanner = new Html5Qrcode("reader");

        const config = {
            fps: 10,

            qrbox: {
                width: 300,
                height: 150
            }
        };


        scanner.start(
            {
                facingMode: "environment"
            },

            config,

            function(decodedText, decodedResult) {

                console.log("Barcode:", decodedText);

                document.getElementById("barcodeNumber").innerText =
                    decodedText;

                document.getElementById("barcodeResult").style.display =
                    "block";

                document.getElementById("scanStatus").innerHTML =
                    '<span class="success">✓ Barcode successfully detected</span>';


                // Stop camera after successful scan
                scanner.stop().then(function() {

                    console.log("Scanner stopped");

                }).catch(function(error) {

                    console.log("Scanner stop error:", error);

                });

            },

            function(errorMessage) {

                // Scanning continues.
                // Do not show errors continuously.

            }

        ).then(function() {

            document.getElementById("scanStatus").innerText =
                "📷 Camera ready — Place the barcode inside the box";

        }).catch(function(error) {

            console.error(error);

            document.getElementById("scanStatus").innerHTML =
                '<span class="error">❌ Unable to access camera. Please allow camera permission and refresh the page.</span>';

        });

    }


    window.onload = function() {

        startScanner();

    };

</script>

</body>
</html>
