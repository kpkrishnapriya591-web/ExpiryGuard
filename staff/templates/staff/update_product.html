<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Product - ExpiryGuard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #111;
            padding: 25px 15px;
        }

        .logo {
            color: #d4af37;
            font-size: 25px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 35px;
        }

        .sidebar a {
            display: block;
            text-decoration: none;
            color: #ddd;
            padding: 14px 18px;
            margin-bottom: 8px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background: #292929;
            color: #d4af37;
        }

        .sidebar a.active {
            background: #d4af37;
            color: #111;
            font-weight: bold;
        }

        /* MAIN */

        .main {
            margin-left: 240px;
            padding: 40px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
        }

        /* FORM */

        .form-container {
            max-width: 850px;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #d4af37;
        }

        /* BUTTONS */

        .buttons {
            margin-top: 10px;
            display: flex;
            gap: 12px;
        }

        .update-btn {
            background: #d4af37;
            color: #111;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .update-btn:hover {
            background: #b8962e;
        }

        .cancel-btn {
            background: #333;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .cancel-btn:hover {
            background: #222;
        }

        /* MOBILE */

        @media(max-width: 700px) {

            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .main {
                margin-left: 0;
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>


<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

    <div class="logo">
        ExpiryGuard
    </div>

    <a href="{% url 'staff_home' %}">
        Home
    </a>

    <a href="{% url 'staff_dashboard' %}">
        Dashboard
    </a>

    <a href="{% url 'add_product' %}">
        Add Products
    </a>

    <a href="{% url 'expiry_simulator' %}">
        Expiry Simulator
    </a>

    <a href="{% url 'staff_product_status' %}" class="active">
        Product Status
    </a>

    <a href="{% url 'staff_notifications' %}">
        Notifications
    </a>

    <a href="{% url 'staff_account' %}">
        My Account
    </a>

    <a href="{% url 'staff_logout' %}">
        Logout
    </a>

</div>


<!-- ================= MAIN ================= -->

<div class="main">

    <div class="header">

        <h1>
            Update Product
        </h1>

        <p>
            Update the product details below.
        </p>

    </div>


    <!-- ================= FORM ================= -->

    <div class="form-container">

        <form method="POST">

            {% csrf_token %}


            <div class="form-row">

                <!-- PRODUCT NAME -->

                <div class="form-group">

                    <label>
                        Product Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        value="{{ product.name }}"
                        required>

                </div>


                <!-- BARCODE -->

                <div class="form-group">

                    <label>
                        Barcode
                    </label>

                    <input
                        type="text"
                        name="barcode"
                        value="{{ product.barcode }}"
                        required>

                </div>


                <!-- BATCH -->

                <div class="form-group">

                    <label>
                        Batch Number
                    </label>

                    <input
                        type="text"
                        name="batch_number"
                        value="{{ product.batch_number }}"
                        required>

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <input
                        type="text"
                        name="category"
                        value="{{ product.category }}">

                </div>


                <!-- PRICE -->

                <div class="form-group">

                    <label>
                        Price
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="price"
                        value="{{ product.price }}"
                        required>

                </div>


                <!-- STOCK -->

                <div class="form-group">

                    <label>
                        Stock Quantity
                    </label>

                    <input
                        type="number"
                        name="stock_quantity"
                        value="{{ product.stock_quantity }}"
                        min="0"
                        required>

                </div>


                <!-- MANUFACTURE DATE -->

                <div class="form-group">

                    <label>
                        Manufacture Date
                    </label>

                    <input
                        type="date"
                        name="manufacture_date"
                        value="{{ product.manufacture_date|date:'Y-m-d' }}">

                </div>


                <!-- EXPIRY DATE -->

                <div class="form-group">

                    <label>
                        Expiry Date
                    </label>

                    <input
                        type="date"
                        name="expiry_date"
                        value="{{ product.expiry_date|date:'Y-m-d' }}"
                        required>

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    type="submit"
                    class="update-btn">

                    ✏️ Update Product

                </button>


                <a
                    href="{% url 'staff_product_status' %}"
                    class="cancel-btn">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
